# MarketPredictor configuration. All tunable settings live here.
# Times are wall-clock times in the stated timezone ("HH:MM").

timezone: Asia/Kolkata

market:
  open_time: "09:15"
  close_time: "15:30"
  morning_run_time: "08:45"
  evening_run_time: "16:15"
  holidays_file: data/calendars/nse_holidays.csv

indices:
  # Expiry schedules are dated so historical rows get the rule in force at the time.
  # SEBI changes these: add a new entry with its start date rather than editing old ones.
  # If an expiry day is a holiday, expiry moves to the previous trading day.
  # monthly = last <weekday> of the month; weekly = every <weekday> (last one is the monthly).
  nifty:
    ticker: "^NSEI"
    name: NIFTY 50
    expiry_schedule:
      - {from: "2008-01-01", frequency: monthly, weekday: Thursday}
      - {from: "2019-02-11", frequency: weekly,  weekday: Thursday}   # weekly options launched
      - {from: "2025-09-01", frequency: weekly,  weekday: Tuesday}    # current
  sensex:
    ticker: "^BSESN"
    name: SENSEX
    expiry_schedule:
      - {from: "2008-01-01", frequency: monthly, weekday: Thursday}   # thinly traded era
      - {from: "2023-05-15", frequency: weekly,  weekday: Friday}     # weekly options relaunched
      - {from: "2025-01-01", frequency: weekly,  weekday: Tuesday}
      - {from: "2025-09-01", frequency: weekly,  weekday: Thursday}   # current

data:
  source: yfinance
  history_start: "2008-03-03"    # India VIX history on Yahoo starts around here
  cache_dir: data/raw
  processed_dir: data/processed
  refetch_overlap_days: 7        # re-download this many days on incremental updates
  max_retries: 3
  retry_backoff_seconds: 2.0
  # Extra delay after an instrument's close before its daily bar counts as final
  # and usable as a feature (covers closing auctions and feed lag).
  publish_delay_minutes: 15
  max_gap_calendar_days: 10      # warn if consecutive bars are further apart than this

# Every downloaded series needs its exchange timezone and the local time its daily
# bar closes. This is what decides when data becomes available in IST (no look-ahead).
# For instruments that trade almost 24h, use the end of Yahoo's daily bar.
instruments:
  "^NSEI":     {group: index,  timezone: Asia/Kolkata,     close_time: "15:30"}
  "^BSESN":    {group: index,  timezone: Asia/Kolkata,     close_time: "15:30"}
  "^NSEBANK":  {group: index,  timezone: Asia/Kolkata,     close_time: "15:30"}
  "^INDIAVIX": {group: vix,    timezone: Asia/Kolkata,     close_time: "15:30"}
  "INR=X":     {group: macro,  timezone: Europe/London,    close_time: "23:59"}
  "BZ=F":      {group: macro,  timezone: America/New_York, close_time: "17:00"}
  "GC=F":      {group: macro,  timezone: America/New_York, close_time: "17:00"}
  "^TNX":      {group: macro,  timezone: America/New_York, close_time: "17:00"}
  "DX-Y.NYB":  {group: macro,  timezone: America/New_York, close_time: "17:00"}
  "^GSPC":     {group: global, timezone: America/New_York, close_time: "16:00"}
  "^IXIC":     {group: global, timezone: America/New_York, close_time: "16:00"}
  "^N225":     {group: asia,   timezone: Asia/Tokyo,       close_time: "15:30"}
  "^HSI":      {group: asia,   timezone: Asia/Hong_Kong,   close_time: "16:10"}

# Optional CSV inputs: loaded if the file exists, skipped otherwise.
# Each CSV needs a date column (session date, IST). A row becomes usable at
# `available_time` IST on that date, unless the CSV has an `available_at` column
# with explicit timezone-aware timestamps.
optional_inputs:
  fii_dii:
    path: data/inputs/fii_dii.csv
    date_column: date
    available_time: "20:00"      # provisional FII/DII figures come out in the evening
  gift_nifty:
    path: data/inputs/gift_nifty.csv
    date_column: date
    available_time: "08:30"      # morning snapshot, before the 08:45 run
    relative_to_prev_close: [price]   # feature = log(price / previous index close)
  pcr_oi:
    path: data/inputs/pcr_oi.csv
    date_column: date
    available_time: "18:00"

features:
  # A cue older than this (cutoff minus bar availability) is treated as missing.
  max_staleness_days: 6
  vix_percentile_window: 252
  # "diff" = change in level instead of log return (for yields).
  transforms:
    "^TNX": diff
  # Add an "hours since this bar became available" feature for these tickers.
  age_features: ["^GSPC"]
  # Which instrument groups and optional inputs each scheduled run may use.
  # Asian cues only in the morning run (CLAUDE.md rule).
  runs:
    morning:
      groups: [index, vix, macro, global, asia]
      optional_inputs: [fii_dii, gift_nifty, pcr_oi]
    evening:
      groups: [index, vix, macro, global]
      optional_inputs: [fii_dii, pcr_oi]

events:
  file: data/calendars/events.csv
  # Event flags are only trusted inside these date ranges; outside them they are
  # left missing (NaN) rather than wrongly set to 0. Extend as dates are added.
  coverage:
    union_budget: ["2008-01-01", "2026-12-31"]
    election_results: ["2008-01-01", "2026-12-31"]
    rbi_policy: ["2022-01-01", "2025-12-31"]
  # Approximate quarterly results seasons, as [MM-DD, MM-DD] windows.
  results_season:
    - ["01-10", "02-15"]
    - ["04-10", "05-20"]
    - ["07-10", "08-15"]
    - ["10-10", "11-15"]

prediction:
  direction_threshold: 0.0       # up if close > previous close * (1 + threshold)
  gap_threshold: 0.002           # |open / previous close - 1| below this counts as flat
