# Keeps the `live` branch (what Streamlit Community Cloud deploys) up to date:
#   weekdays 07:30 / 08:00 / 08:30 IST -> morning forecast for today
#   weekdays 16:00 / 16:30 / 17:00 IST -> evening forecast for the next session
#   Saturdays 10:00 IST                -> retrain all models + backtest
# GitHub runs schedules on a best-effort basis and can start them hours late, so each
# forecast has three slots: whichever starts first makes it, later ones refresh it.
# After 09:15 IST (market open) a run makes no new forecast (CLAUDE.md timing rule).
# `live` = master's code + one commit with generated data, models and predictions.
# It is rebuilt (force-pushed) each run so the repo doesn't grow with every retrain;
# the predictions log and data cache carry over from the previous `live`.
name: Update forecasts

on:
  schedule:
    - cron: "0 2 * * 1-5"    # 07:30 IST
    - cron: "30 2 * * 1-5"   # 08:00 IST
    - cron: "0 3 * * 1-5"    # 08:30 IST
    - cron: "30 10 * * 1-5"  # 16:00 IST
    - cron: "0 11 * * 1-5"   # 16:30 IST
    - cron: "30 11 * * 1-5"  # 17:00 IST
    - cron: "30 4 * * 6"     # Saturday 10:00 IST: retrain
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [daily, retrain]
        default: daily

permissions:
  contents: write

concurrency:
  group: live-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 4 * * 6" ]; then
            echo "task=retrain" >> "$GITHUB_OUTPUT"
          else
            echo "task=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore data, models and predictions from the live branch
        run: |
          if git fetch origin live; then
            for p in data/raw data/processed models/artifacts reports; do
              git checkout origin/live -- "$p" 2>/dev/null || echo "no $p on live yet"
            done
          else
            echo "No live branch yet: starting from scratch (full data download)."
          fi
          git reset -q  # keep restored files in the working tree only

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Daily forecast
        if: steps.task.outputs.task == 'daily'
        run: python scripts/daily_update.py

      - name: Retrain and backtest
        if: steps.task.outputs.task == 'retrain'
        run: |
          python scripts/retrain.py --refresh
          python scripts/backtest.py

      - name: Publish to the live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B live
          git add -f data/raw data/processed models/artifacts reports/*.json reports/*.md 2>/dev/null || true
          git commit -q -m "Update data: ${{ steps.task.outputs.task }} $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          # GitHub occasionally rejects a push with a transient server error; retry.
          for delay in 5 15 30 60; do
            if git push -f origin live; then exit 0; fi
            echo "push failed; retrying in ${delay}s"
            sleep "$delay"
          done
          git push -f origin live
